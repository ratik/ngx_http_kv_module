name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Nginx ${{ matrix.nginx-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx-version:
          - 1.24.0
          - 1.26.3
          - 1.27.4

    env:
      NGINX_VERSION: ${{ matrix.nginx-version }}
      COMPOSE_PROFILES: bad-backend
      COMPOSE_PROJECT_NAME: kv_${{ github.run_id }}_${{ strategy.job-index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build and run integration tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    env:
      NGINX_VERSION: 1.27.4
      COMPOSE_PROFILES: bench
      COMPOSE_PROJECT_NAME: kv_perf_${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for baseline
        id: baseline
        run: |
          if [ -f benchmarks/baseline/main.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No benchmarks/baseline/main.json; skipping performance regression check."
          fi

      - name: Run benchmarks
        if: steps.baseline.outputs.exists == 'true'
        run: make bench

      - name: Compare with baseline
        if: steps.baseline.outputs.exists == 'true'
        run: make bench-compare

      - name: Upload performance report
        if: always() && steps.baseline.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: benchmarks/results/**

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  sanitizer-test:
    name: Nginx ${{ matrix.nginx-version }} ASan/UBSan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx-version:
          - 1.27.4

    env:
      NGINX_VERSION: ${{ matrix.nginx-version }}
      SANITIZERS: 1
      COMPOSE_PROFILES: bad-backend
      COMPOSE_PROJECT_NAME: kv_san_${{ github.run_id }}_${{ strategy.job-index }}
      ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build and run sanitizer integration tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
