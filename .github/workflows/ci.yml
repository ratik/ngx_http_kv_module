name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Nginx ${{ matrix.nginx-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx-version:
          - 1.24.0
          - 1.26.3
          - 1.27.4

    env:
      NGINX_VERSION: ${{ matrix.nginx-version }}
      COMPOSE_PROFILES: bad-backend
      COMPOSE_PROJECT_NAME: kv_${{ github.run_id }}_${{ strategy.job-index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build and run integration tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  sanitizer-test:
    name: Nginx ${{ matrix.nginx-version }} ASan/UBSan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nginx-version:
          - 1.27.4

    env:
      NGINX_VERSION: ${{ matrix.nginx-version }}
      SANITIZERS: 1
      COMPOSE_PROFILES: bad-backend
      COMPOSE_PROJECT_NAME: kv_san_${{ github.run_id }}_${{ strategy.job-index }}
      ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build and run sanitizer integration tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
