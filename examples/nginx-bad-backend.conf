load_module modules/ngx_http_kv_module.so;

worker_processes 1;
error_log /var/log/nginx/error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    client_body_temp_path /tmp/nginx-client-body;

    server {
        listen 8082;

        location /kv/ {
            kv_memcached_pass unix:/sock/missing-memcached.sock;
            kv_default_ttl 300;
            kv_max_value_size 1m;
            kv_key_prefix "app:";
            kv_connect_timeout 1s;
            kv_send_timeout 1s;
            kv_read_timeout 1s;
        }
    }
}
