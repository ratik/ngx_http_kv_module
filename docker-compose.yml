services:
  kv-nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.27.4}
        SANITIZERS: ${SANITIZERS:-0}
    environment:
      ASAN_OPTIONS: ${ASAN_OPTIONS:-detect_leaks=0:detect_odr_violation=0:abort_on_error=1}
      UBSAN_OPTIONS: ${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/kv/__health_missing__"]
      interval: 2s
      timeout: 1s
      retries: 20

  fake-memcached:
    image: python:3.12-slim
    working_dir: /tests
    volumes:
      - ./tests:/tests:ro
      - fuzz-sock:/sock
    command: python /tests/fake_memcached.py

  kv-nginx-fuzz:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.27.4}
        SANITIZERS: ${SANITIZERS:-0}
    depends_on:
      fake-memcached:
        condition: service_started
    ports:
      - "8081:8081"
    volumes:
      - ./examples/nginx-fuzz.conf:/usr/local/nginx/conf/nginx-fuzz.conf:ro
      - fuzz-sock:/sock
    environment:
      NGINX_CONF: /usr/local/nginx/conf/nginx-fuzz.conf
      ASAN_OPTIONS: ${ASAN_OPTIONS:-detect_leaks=0:detect_odr_violation=0:abort_on_error=1}
      UBSAN_OPTIONS: ${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/kv/__health_missing__"]
      interval: 2s
      timeout: 1s
      retries: 20

  kv-nginx-bad-backend:
    profiles: ["bad-backend"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.27.4}
        SANITIZERS: ${SANITIZERS:-0}
    ports:
      - "8082:8082"
    volumes:
      - ./examples/nginx-bad-backend.conf:/usr/local/nginx/conf/nginx-bad-backend.conf:ro
    environment:
      NGINX_CONF: /usr/local/nginx/conf/nginx-bad-backend.conf
      ASAN_OPTIONS: ${ASAN_OPTIONS:-detect_leaks=0:detect_odr_violation=0:abort_on_error=1}
      UBSAN_OPTIONS: ${UBSAN_OPTIONS:-halt_on_error=1:print_stacktrace=1}
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/kv/__health_missing__); test \"$$code\" = 502"]
      interval: 2s
      timeout: 1s
      retries: 20

  bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/bench.Dockerfile
    depends_on:
      kv-nginx:
        condition: service_started
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      KV_BENCH_URL: http://kv-nginx:8080
      NGINX_VERSION: ${NGINX_VERSION:-1.27.4}
      NGINX_CONF_PATH: /workspace/examples/nginx.conf
    command: ["bench", "--base-url", "http://kv-nginx:8080"]

  bench-compare:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/bench.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["compare"]

  bench-update-baseline:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/bench.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["update-baseline"]

  tests:
    profiles: ["bad-backend"]
    image: python:3.12-slim
    depends_on:
      kv-nginx:
        condition: service_started
      kv-nginx-fuzz:
        condition: service_started
      kv-nginx-bad-backend:
        condition: service_started
    working_dir: /tests
    volumes:
      - ./tests:/tests:ro
    environment:
      KV_BASE_URL: http://kv-nginx:8080
      KV_FUZZ_URL: http://kv-nginx-fuzz:8081
      KV_BAD_BACKEND_URL: http://kv-nginx-bad-backend:8082
    command: sh -c "pip install -q pytest requests hypothesis && pytest -q"

volumes:
  fuzz-sock:
